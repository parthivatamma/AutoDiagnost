[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodiagnost"
version = "0.1.0"
description = "Offline-friendly OBD-II diagnostic assistant."
readme = "DESIGN.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
obd = ["obd>=0.7"]
ml = ["numpy>=1.24", "scikit-learn>=1.4", "joblib>=1.3"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["autodiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
